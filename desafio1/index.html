<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Falta cor aqui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="paint-canvas"></canvas>

  <main class="scene">
    <p class="intro" id="intro">Falta cor aqui.</p>
    <p class="percent" id="percent" aria-hidden="true"></p>

    <div class="finale" id="finale" aria-hidden="true">
      <p class="finale-line" id="finale-1">Agora sim.</p>
      <p class="finale-line" id="finale-2">Você encontrou o que estava faltando.</p>
      <p class="finale-label" id="finale-3">Seu presente:</p>
      <p class="key" id="key"></p>
    </div>
  </main>
  
  <img id="brush" class="tool tool--brush" src="assets/pincel.png" alt="" draggable="false">
  <img id="bucket" class="tool tool--bucket" src="assets/balde.png" alt="" draggable="false">

  <p class="toast" id="toast" aria-live="polite"></p>

  <script src="script.js"></script>
</body>
</html>
